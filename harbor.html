<!doctype html>
<html lang="en">
<head>
  <title>The Harbor - Spring of Zen</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="One room tone for today.">
  <meta property="og:title" content="The Harbor - Spring of Zen">
  <meta property="og:description" content="A quiet room tone for those tired of the scroll.">
  <meta property="og:type" content="website">
  <link rel="stylesheet" href="assets/css/v52-index.css">
</head>
<body class="part-page harbor-page">
  <div class="lang-switch" aria-label="Language">
    <button type="button" data-lang-button="en">EN</button>
    <button type="button" data-lang-button="zh">繁中</button>
  </div>
  <header class="top-chrome" aria-label="Room controls">
    <a href="index.html" class="quiet-brand">spring of zen</a>
    <button id="roomToneToggle" class="tone-toggle" type="button" aria-pressed="false" data-i18n="roomTone">room tone</button>
  </header>

  <main>
    <section class="night-dock part-room" aria-labelledby="harborTitle">
      <div class="dock-veil" aria-hidden="true"></div>
      <div class="dock-copy is-revealed">
        <p class="part-kicker" data-i18n="harborKicker">The Harbor</p>
        <h1 id="harborTitle" data-i18n-html="harborTitle">Somewhere a small dock,<br>a single light,<br>water moving without hurry.</h1>
        <p data-i18n="harborLine">This is what the inside of your chest can feel like, if you give it a few minutes.</p>
        <button class="text-tone-link" type="button" data-tone-link data-i18n="turnOnRoomTone">turn on the room tone</button>
      </div>
    </section>
  </main>

  <audio id="roomTone" loop preload="none" src="assets/audio/harbor-roomtone.mp3"></audio>
  <script src="assets/js/v52-index.js"></script>
</body>
</html>
